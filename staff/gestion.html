<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion — HoriblitiMatch</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0b0e14;
            --sidebar: #0e121a;
            --surface: #121722;
            --surface-2: #171d29;
            --border: #252d3c;
            --text: #f2f4f8;
            --muted: #8992a4;
            --accent: #7c5cff;
            --accent-2: #5f8cff;
            --danger: #ef5b6b;
            --success: #47d18c;
            --shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .app {
            min-height: 100vh;
            display: flex;
        }

        /* SIDEBAR */

        .sidebar {
            width: 250px;
            min-height: 100vh;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            padding: 24px 16px;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            z-index: 50;
        }

        .brand {
            padding: 6px 10px 28px;
        }

        .brand strong {
            display: block;
            font-size: 21px;
            letter-spacing: -0.5px;
        }

        .brand span {
            display: block;
            color: var(--muted);
            font-size: 12px;
            margin-top: 5px;
        }

        .nav-title {
            color: #626b7c;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin: 18px 10px 9px;
        }

        .nav {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .nav a {
            padding: 12px 12px;
            border-radius: 9px;
            color: #9da5b5;
            font-size: 14px;
            transition: 0.2s ease;
        }

        .nav a:hover {
            background: #151b27;
            color: white;
        }

        .nav a.active {
            background: rgba(124, 92, 255, 0.14);
            color: white;
            border: 1px solid rgba(124, 92, 255, 0.2);
        }

        .sidebar-bottom {
            position: absolute;
            left: 16px;
            right: 16px;
            bottom: 18px;
        }

        .site-link {
            display: block;
            padding: 11px 12px;
            border: 1px solid var(--border);
            border-radius: 9px;
            color: #aeb6c6;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .logout-btn {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid rgba(239, 91, 107, 0.2);
            background: rgba(239, 91, 107, 0.07);
            color: #f28b96;
            border-radius: 9px;
        }

        /* MAIN */

        .main {
            width: calc(100% - 250px);
            margin-left: 250px;
            min-height: 100vh;
        }

        .topbar {
            height: 74px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            background: rgba(11, 14, 20, 0.88);
            position: sticky;
            top: 0;
            z-index: 30;
            backdrop-filter: blur(12px);
        }

        .topbar-left h1 {
            font-size: 20px;
        }

        .topbar-left p {
            color: var(--muted);
            font-size: 12px;
            margin-top: 4px;
        }

        .user-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            font-size: 13px;
            font-weight: bold;
        }

        .user-info strong {
            display: block;
            font-size: 13px;
        }

        .user-info span {
            display: block;
            color: var(--muted);
            font-size: 11px;
            margin-top: 2px;
        }

        .content {
            padding: 30px;
            max-width: 1500px;
            margin: auto;
        }

        /* TABS */

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .tab {
            border: 1px solid var(--border);
            background: var(--surface);
            color: #9da5b5;
            padding: 11px 17px;
            border-radius: 9px;
            transition: 0.2s ease;
        }

        .tab:hover {
            color: white;
            background: var(--surface-2);
        }

        .tab.active {
            background: rgba(124, 92, 255, 0.14);
            border-color: rgba(124, 92, 255, 0.35);
            color: white;
        }

        .tab-count {
            display: inline-flex;
            min-width: 20px;
            height: 20px;
            padding: 0 5px;
            align-items: center;
            justify-content: center;
            margin-left: 6px;
            border-radius: 20px;
            background: #20283a;
            font-size: 10px;
        }

        /* TOOLBAR */

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .toolbar {
            padding: 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }

        .search {
            position: relative;
            flex: 1;
            min-width: 220px;
        }

        .search input {
            width: 100%;
            background: #0d1119;
            border: 1px solid var(--border);
            color: white;
            padding: 12px 14px 12px 38px;
            border-radius: 9px;
            outline: none;
        }

        .search input:focus {
            border-color: rgba(124, 92, 255, 0.55);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #697285;
            pointer-events: none;
        }

        .primary-btn {
            border: 0;
            border-radius: 9px;
            padding: 12px 17px;
            color: white;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            font-weight: 600;
            transition: 0.2s ease;
        }

        .primary-btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.08);
        }

        /* TABLE */

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 760px;
        }

        th,
        td {
            padding: 15px 18px;
            text-align: left;
            border-bottom: 1px solid #202735;
        }

        th {
            color: #70798a;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        td {
            font-size: 13px;
            color: #dfe3ea;
        }

        tbody tr {
            transition: 0.15s ease;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.018);
        }

        tbody tr:last-child td {
            border-bottom: 0;
        }

        .title-cell {
            max-width: 360px;
        }

        .title-cell strong {
            display: block;
            color: white;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .title-cell span {
            display: block;
            color: var(--muted);
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 5px 9px;
            border-radius: 20px;
            background: #1d2534;
            color: #abb4c6;
            font-size: 11px;
        }

        .date {
            color: #788193;
            font-size: 12px;
        }

        .actions {
            display: flex;
            gap: 7px;
        }

        .action-btn {
            border: 1px solid var(--border);
            background: #151b26;
            color: #b7bfce;
            border-radius: 7px;
            padding: 7px 10px;
            font-size: 11px;
        }

        .action-btn:hover {
            color: white;
            background: #1b2230;
        }

        .action-btn.delete {
            color: #e77d88;
            border-color: rgba(239, 91, 107, 0.15);
        }

        .action-btn.delete:hover {
            background: rgba(239, 91, 107, 0.1);
        }

        .empty {
            padding: 65px 20px;
            text-align: center;
            color: var(--muted);
        }

        .empty strong {
            display: block;
            color: #dce1ea;
            margin-bottom: 7px;
        }

        .loading {
            padding: 50px;
            text-align: center;
            color: var(--muted);
        }

        /* MODAL */

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.72);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            width: min(600px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            background: #111722;
            border: 1px solid var(--border);
            border-radius: 15px;
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.5);
        }

        .modal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }

        .modal-head h2 {
            font-size: 18px;
        }

        .close {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #161c27;
            color: #aab2c1;
            font-size: 17px;
        }

        .modal-body {
            padding: 20px;
        }

        .field {
            margin-bottom: 17px;
        }

        .field:last-child {
            margin-bottom: 0;
        }

        .field label {
            display: block;
            color: #aeb6c6;
            font-size: 12px;
            margin-bottom: 7px;
        }

        .field input,
        .field textarea,
        .field select {
            width: 100%;
            background: #0c1017;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            outline: none;
            padding: 11px 12px;
        }

        .field input:focus,
        .field textarea:focus,
        .field select:focus {
            border-color: rgba(124, 92, 255, 0.55);
        }

        .field textarea {
            min-height: 145px;
            resize: vertical;
            line-height: 1.55;
        }

        .field small {
            display: block;
            color: #626c7d;
            margin-top: 6px;
            font-size: 10px;
        }

        .modal-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 9px;
        }

        .secondary-btn {
            border: 1px solid var(--border);
            background: #171d28;
            color: #aeb6c5;
            border-radius: 8px;
            padding: 10px 15px;
        }

        .secondary-btn:hover {
            color: white;
        }

        /* TOAST */

        .toast {
            position: fixed;
            right: 22px;
            bottom: 22px;
            max-width: 360px;
            padding: 13px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #151b25;
            color: white;
            box-shadow: var(--shadow);
            transform: translateY(25px);
            opacity: 0;
            pointer-events: none;
            transition: 0.25s ease;
            z-index: 200;
            font-size: 13px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success {
            border-color: rgba(71, 209, 140, 0.25);
        }

        .toast.error {
            border-color: rgba(239, 91, 107, 0.3);
            color: #ff9aa5;
        }

        /* MOBILE */

        .mobile-menu {
            display: none;
            width: 38px;
            height: 38px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: white;
            border-radius: 8px;
        }

        @media (max-width: 900px) {
            .sidebar {
                transform: translateX(-100%);
                transition: 0.25s ease;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main {
                width: 100%;
                margin-left: 0;
            }

            .mobile-menu {
                display: block;
            }

            .topbar {
                padding: 0 18px;
            }

            .content {
                padding: 20px 15px;
            }

            .user-info {
                display: none;
            }
        }

        @media (max-width: 600px) {
            .topbar-left h1 {
                font-size: 17px;
            }

            .topbar-left p {
                display: none;
            }

            .toolbar {
                align-items: stretch;
            }

            .search {
                min-width: 100%;
            }

            .primary-btn {
                width: 100%;
            }

            .tabs {
                display: grid;
                grid-template-columns: 1fr;
            }

            .tab {
                width: 100%;
                text-align: left;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <aside class="sidebar" id="sidebar">

        <div class="brand">
            <strong>HoriblitiMatch</strong>
            <span>Administration</span>
        </div>

        <div class="nav-title">Principal</div>

        <nav class="nav">
            <a href="index.html">Tableau de bord</a>
            <a href="gestion.html" class="active">Gestion</a>
            <a href="medias.html">Médias</a>
        </nav>

        <div class="nav-title">Administration</div>

        <nav class="nav">
            <a href="equipe.html">Équipe</a>
            <a href="parametres.html">Paramètres</a>
        </nav>

        <div class="sidebar-bottom">
            <a href="../index.html" target="_blank" class="site-link">
                ↗ Voir le site
            </a>

            <button class="logout-btn" id="logoutBtn">
                Se déconnecter
            </button>
        </div>

    </aside>

    <main class="main">

        <header class="topbar">

            <div class="topbar-left">
                <h1>Gestion du contenu</h1>
                <p>Gérez les annonces, réalisations et partenaires.</p>
            </div>

            <div class="user-box">
                <div class="avatar" id="avatar">H</div>

                <div class="user-info">
                    <strong id="userName">Staff</strong>
                    <span id="userRole">Staff</span>
                </div>

                <button class="mobile-menu" id="mobileMenu">☰</button>
            </div>

        </header>

        <section class="content">

            <div class="tabs">

                <button class="tab active" data-tab="annonces">
                    Annonces
                    <span class="tab-count" id="countAnnonces">0</span>
                </button>

                <button class="tab" data-tab="realisations">
                    Réalisations
                    <span class="tab-count" id="countRealisations">0</span>
                </button>

                <button class="tab" data-tab="partenaires">
                    Partenaires
                    <span class="tab-count" id="countPartenaires">0</span>
                </button>

            </div>

            <div class="panel">

                <div class="toolbar">

                    <div class="search">
                        <span class="search-icon">⌕</span>
                        <input
                            type="search"
                            id="searchInput"
                            placeholder="Rechercher..."
                            autocomplete="off"
                        >
                    </div>

                    <button class="primary-btn" id="addBtn">
                        + Ajouter
                    </button>

                </div>

                <div id="contentArea">
                    <div class="loading">
                        Chargement des données...
                    </div>
                </div>

            </div>

        </section>

    </main>

</div>

<!-- MODAL -->

<div class="modal-overlay" id="modalOverlay">

    <div class="modal">

        <div class="modal-head">
            <h2 id="modalTitle">Ajouter</h2>
            <button class="close" id="closeModal">×</button>
        </div>

        <form id="contentForm">

            <div class="modal-body" id="formBody"></div>

            <div class="modal-footer">

                <button type="button" class="secondary-btn" id="cancelBtn">
                    Annuler
                </button>

                <button type="submit" class="primary-btn" id="saveBtn">
                    Enregistrer
                </button>

            </div>

        </form>

    </div>

</div>

<div class="toast" id="toast"></div>

<script type="module">

    import { supabaseClient } from "../js/supabase.js";

    const state = {
        currentTab: "annonces",
        editingId: null,
        data: {
            annonces: [],
            realisations: [],
            partenaires: []
        }
    };

    const contentArea = document.getElementById("contentArea");
    const searchInput = document.getElementById("searchInput");
    const modalOverlay = document.getElementById("modalOverlay");
    const modalTitle = document.getElementById("modalTitle");
    const formBody = document.getElementById("formBody");
    const contentForm = document.getElementById("contentForm");
    const toast = document.getElementById("toast");

    let toastTimer = null;

    function showToast(message, type) {

        clearTimeout(toastTimer);

        toast.textContent = message;
        toast.className = "toast show " + (type || "");

        toastTimer = setTimeout(function () {
            toast.className = "toast";
        }, 3200);
    }

    function escapeHtml(value) {

        if (value === null || value === undefined) {
            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function formatDate(value) {

        if (!value) {
            return "—";
        }

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
            return "—";
        }

        return date.toLocaleDateString("fr-FR", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        });
    }

    function getInitial(name, email) {

        const value = name || email || "H";

        return value
            .trim()
            .charAt(0)
            .toUpperCase();
    }

    async function checkAuth() {

        const result = await supabaseClient.auth.getSession();

        const session = result.data ? result.data.session : null;

        if (result.error || !session) {
            window.location.href = "../pages/connexion.html";
            return null;
        }

        const staffResult = await supabaseClient
            .from("staff")
            .select("id,email,nom,role")
            .eq("id", session.user.id)
            .maybeSingle();

        if (staffResult.error || !staffResult.data) {
            await supabaseClient.auth.signOut();
            window.location.href = "../pages/connexion.html";
            return null;
        }

        const staff = staffResult.data;

        document.getElementById("userName").textContent =
            staff.nom || staff.email || "Staff";

        document.getElementById("userRole").textContent =
            staff.role === "admin" ? "Administrateur" : "Staff";

        document.getElementById("avatar").textContent =
            getInitial(staff.nom, staff.email);

        return staff;
    }

    async function loadAll() {

        contentArea.innerHTML =
            '<div class="loading">Chargement des données...</div>';

        const results = await Promise.all([
            supabaseClient
                .from("annonces")
                .select("id,titre,categorie,contenu,created_at,updated_at")
                .order("created_at", { ascending: false }),

            supabaseClient
                .from("realisations")
                .select("id,titre,description,lien,created_at,updated_at")
                .order("created_at", { ascending: false }),

            supabaseClient
                .from("partenaires")
                .select("id,nom,description,lien,created_at,updated_at")
                .order("created_at", { ascending: false })
        ]);

        if (results[0].error) {
            console.error(results[0].error);
            showToast("Impossible de charger les annonces.", "error");
        }

        if (results[1].error) {
            console.error(results[1].error);
            showToast("Impossible de charger les réalisations.", "error");
        }

        if (results[2].error) {
            console.error(results[2].error);
            showToast("Impossible de charger les partenaires.", "error");
        }

        state.data.annonces = results[0].data || [];
        state.data.realisations = results[1].data || [];
        state.data.partenaires = results[2].data || [];

        updateCounts();
        render();
    }

    function updateCounts() {

        document.getElementById("countAnnonces").textContent =
            state.data.annonces.length;

        document.getElementById("countRealisations").textContent =
            state.data.realisations.length;

        document.getElementById("countPartenaires").textContent =
            state.data.partenaires.length;
    }

    function getFilteredData() {

        const query = searchInput.value.trim().toLowerCase();

        const items = state.data[state.currentTab] || [];

        if (!query) {
            return items;
        }

        return items.filter(function (item) {

            let text = "";

            if (state.currentTab === "annonces") {
                text =
                    (item.titre || "") + " " +
                    (item.categorie || "") + " " +
                    (item.contenu || "");
            }

            if (state.currentTab === "realisations") {
                text =
                    (item.titre || "") + " " +
                    (item.description || "") + " " +
                    (item.lien || "");
            }

            if (state.currentTab === "partenaires") {
                text =
                    (item.nom || "") + " " +
                    (item.description || "") + " " +
                    (item.lien || "");
            }

            return text.toLowerCase().includes(query);
        });
    }

    function render() {

        const items = getFilteredData();

        if (!items.length) {

            contentArea.innerHTML =
                '<div class="empty">' +
                    '<strong>Aucun élément trouvé</strong>' +
                    '<span>Il n’y a aucun contenu correspondant à votre recherche.</span>' +
                '</div>';

            return;
        }

        let html =
            '<div class="table-wrap">' +
                '<table>' +
                    '<thead>' +
                        '<tr>';

        if (state.currentTab === "annonces") {

            html +=
                '<th>Titre</th>' +
                '<th>Catégorie</th>' +
                '<th>Création</th>' +
                '<th>Modification</th>' +
                '<th>Actions</th>';

        } else if (state.currentTab === "realisations") {

            html +=
                '<th>Réalisation</th>' +
                '<th>Lien</th>' +
                '<th>Création</th>' +
                '<th>Modification</th>' +
                '<th>Actions</th>';

        } else {

            html +=
                '<th>Partenaire</th>' +
                '<th>Lien</th>' +
                '<th>Création</th>' +
                '<th>Modification</th>' +
                '<th>Actions</th>';
        }

        html +=
                        '</tr>' +
                    '</thead>' +
                    '<tbody>';

        items.forEach(function (item) {

            if (state.currentTab === "annonces") {

                const contenu = item.contenu || "";

                html +=
                    '<tr>' +
                        '<td class="title-cell">' +
                            '<strong>' + escapeHtml(item.titre) + '</strong>' +
                            '<span>' + escapeHtml(contenu) + '</span>' +
                        '</td>' +
                        '<td>' +
                            '<span class="badge">' +
                                escapeHtml(item.categorie) +
                            '</span>' +
                        '</td>' +
                        '<td class="date">' +
                            formatDate(item.created_at) +
                        '</td>' +
                        '<td class="date">' +
                            formatDate(item.updated_at) +
                        '</td>' +
                        '<td>' +
                            actionButtons(item.id) +
                        '</td>' +
                    '</tr>';

            } else if (state.currentTab === "realisations") {

                html +=
                    '<tr>' +
                        '<td class="title-cell">' +
                            '<strong>' + escapeHtml(item.titre) + '</strong>' +
                            '<span>' + escapeHtml(item.description || "") + '</span>' +
                        '</td>' +
                        '<td>' +
                            renderLink(item.lien) +
                        '</td>' +
                        '<td class="date">' +
                            formatDate(item.created_at) +
                        '</td>' +
                        '<td class="date">' +
                            formatDate(item.updated_at) +
                        '</td>' +
                        '<td>' +
                            actionButtons(item.id) +
                        '</td>' +
                    '</tr>';

            } else {

                html +=
                    '<tr>' +
                        '<td class="title-cell">' +
                            '<strong>' + escapeHtml(item.nom) + '</strong>' +
                            '<span>' + escapeHtml(item.description || "") + '</span>' +
                        '</td>' +
                        '<td>' +
                            renderLink(item.lien) +
                        '</td>' +
                        '<td class="date">' +
                            formatDate(item.created_at) +
                        '</td>' +
                        '<td class="date">' +
                            formatDate(item.updated_at) +
                        '</td>' +
                        '<td>' +
                            actionButtons(item.id) +
                        '</td>' +
                    '</tr>';
            }

        });

        html +=
                    '</tbody>' +
                '</table>' +
            '</div>';

        contentArea.innerHTML = html;
    }

    function renderLink(link) {

        if (!link) {
            return '<span class="date">Aucun lien</span>';
        }

        let safeLink = String(link);

        if (
            !safeLink.startsWith("http://") &&
            !safeLink.startsWith("https://")
        ) {
            return '<span class="date">' + escapeHtml(link) + '</span>';
        }

        return (
            '<a href="' +
            escapeHtml(safeLink) +
            '" target="_blank" rel="noopener noreferrer" ' +
            'style="color:#9f8cff;font-size:12px;">' +
            'Ouvrir ↗' +
            '</a>'
        );
    }

    function actionButtons(id) {

        return (
            '<div class="actions">' +
                '<button class="action-btn edit-btn" data-id="' +
                    escapeHtml(id) +
                '">' +
                    'Modifier' +
                '</button>' +

                '<button class="action-btn delete delete-btn" data-id="' +
                    escapeHtml(id) +
                '">' +
                    'Supprimer' +
                '</button>' +
            '</div>'
        );
    }

    function openModal(id) {

        state.editingId = id || null;

        let item = null;

        if (id) {

            item = state.data[state.currentTab].find(function (entry) {
                return entry.id === id;
            });
        }

        const editing = Boolean(item);

        modalTitle.textContent =
            editing
                ? "Modifier " + getTabSingular()
                : "Ajouter " + getTabSingular();

        if (state.currentTab === "annonces") {

            formBody.innerHTML =
                '<div class="field">' +
                    '<label for="fieldTitre">Titre</label>' +
                    '<input id="fieldTitre" type="text" maxlength="200" required value="' +
                        escapeHtml(item ? item.titre : "") +
                    '">' +
                '</div>' +

                '<div class="field">' +
                    '<label for="fieldCategorie">Catégorie</label>' +
                    '<select id="fieldCategorie" required>' +
                        categoryOption("Information", item ? item.categorie : "") +
                        categoryOption("Actualité", item ? item.categorie : "") +
                        categoryOption("Nouveauté", item ? item.categorie : "") +
                        categoryOption("Projet", item ? item.categorie : "") +
                        categoryOption("Autre", item ? item.categorie : "") +
                    '</select>' +
                '</div>' +

                '<div class="field">' +
                    '<label for="fieldContenu">Contenu</label>' +
                    '<textarea id="fieldContenu" required>' +
                        escapeHtml(item ? item.contenu : "") +
                    '</textarea>' +
                '</div>';

        } else if (state.currentTab === "realisations") {

            formBody.innerHTML =
                '<div class="field">' +
                    '<label for="fieldTitre">Titre</label>' +
                    '<input id="fieldTitre" type="text" maxlength="200" required value="' +
                        escapeHtml(item ? item.titre : "") +
                    '">' +
                '</div>' +

                '<div class="field">' +
                    '<label for="fieldDescription">Description</label>' +
                    '<textarea id="fieldDescription">' +
                        escapeHtml(item ? item.description : "") +
                    '</textarea>' +
                '</div>' +

                '<div class="field">' +
                    '<label for="fieldLien">Lien du projet</label>' +
                    '<input id="fieldLien" type="url" placeholder="https://..." value="' +
                        escapeHtml(item ? item.lien : "") +
                    '">' +
                    '<small>Optionnel. Laissez vide si le projet n’a pas de lien public.</small>' +
                '</div>';

        } else {

            formBody.innerHTML =
                '<div class="field">' +
                    '<label for="fieldNom">Nom du partenaire</label>' +
                    '<input id="fieldNom" type="text" maxlength="200" required value="' +
                        escapeHtml(item ? item.nom : "") +
                    '">' +
                '</div>' +

                '<div class="field">' +
                    '<label for="fieldDescription">Description</label>' +
                    '<textarea id="fieldDescription">' +
                        escapeHtml(item ? item.description : "") +
                    '</textarea>' +
                '</div>' +

                '<div class="field">' +
                    '<label for="fieldLien">Lien</label>' +
                    '<input id="fieldLien" type="url" placeholder="https://..." value="' +
                        escapeHtml(item ? item.lien : "") +
                    '">' +
                    '<small>Optionnel.</small>' +
                '</div>';
        }

        modalOverlay.classList.add("show");

        const firstInput = formBody.querySelector("input");

        if (firstInput) {
            setTimeout(function () {
                firstInput.focus();
            }, 50);
        }
    }

    function categoryOption(value, selected) {

        const isSelected =
            selected === value ? " selected" : "";

        return (
            '<option value="' +
            escapeHtml(value) +
            '"' +
            isSelected +
            '>' +
            escapeHtml(value) +
            '</option>'
        );
    }

    function getTabSingular() {

        if (state.currentTab === "annonces") {
            return "une annonce";
        }

        if (state.currentTab === "realisations") {
            return "une réalisation";
        }

        return "un partenaire";
    }

    function closeModal() {

        modalOverlay.classList.remove("show");
        state.editingId = null;
        contentForm.reset();
    }

    async function saveContent(event) {

        event.preventDefault();

        const saveBtn = document.getElementById("saveBtn");

        saveBtn.disabled = true;
        saveBtn.textContent = "Enregistrement...";

        try {

            let payload = {};
            let table = state.currentTab;

            if (state.currentTab === "annonces") {

                const titre =
                    document.getElementById("fieldTitre").value.trim();

                const categorie =
                    document.getElementById("fieldCategorie").value.trim();

                const contenu =
                    document.getElementById("fieldContenu").value.trim();

                if (!titre || !categorie || !contenu) {
                    throw new Error("Veuillez remplir tous les champs obligatoires.");
                }

                payload = {
                    titre: titre,
                    categorie: categorie,
                    contenu: contenu
                };

            } else if (state.currentTab === "realisations") {

                const titre =
                    document.getElementById("fieldTitre").value.trim();

                const description =
                    document.getElementById("fieldDescription").value.trim();

                const lien =
                    document.getElementById("fieldLien").value.trim();

                if (!titre) {
                    throw new Error("Le titre est obligatoire.");
                }

                payload = {
                    titre: titre,
                    description: description || null,
                    lien: lien || null
                };

            } else {

                const nom =
                    document.getElementById("fieldNom").value.trim();

                const description =
                    document.getElementById("fieldDescription").value.trim();

                const lien =
                    document.getElementById("fieldLien").value.trim();

                if (!nom) {
                    throw new Error("Le nom du partenaire est obligatoire.");
                }

                payload = {
                    nom: nom,
                    description: description || null,
                    lien: lien || null
                };
            }

            let result;

            if (state.editingId) {

                result = await supabaseClient
                    .from(table)
                    .update(payload)
                    .eq("id", state.editingId);

            } else {

                result = await supabaseClient
                    .from(table)
                    .insert(payload);
            }

            if (result.error) {
                throw result.error;
            }

            closeModal();

            await loadAll();

            showToast(
                state.editingId
                    ? "Contenu modifié avec succès."
                    : "Contenu ajouté avec succès.",
                "success"
            );

        } catch (error) {

            console.error(error);

            showToast(
                error.message || "Une erreur est survenue.",
                "error"
            );

        } finally {

            saveBtn.disabled = false;
            saveBtn.textContent = "Enregistrer";
        }
    }

    async function deleteContent(id) {

        const item =
            state.data[state.currentTab].find(function (entry) {
                return entry.id === id;
            });

        if (!item) {
            return;
        }

        let name =
            state.currentTab === "partenaires"
                ? item.nom
                : item.titre;

        const confirmed = window.confirm(
            'Voulez-vous vraiment supprimer "' +
            name +
            '" ?\n\nCette action est définitive.'
        );

        if (!confirmed) {
            return;
        }

        const result = await supabaseClient
            .from(state.currentTab)
            .delete()
            .eq("id", id);

        if (result.error) {

            console.error(result.error);

            showToast(
                "Impossible de supprimer cet élément.",
                "error"
            );

            return;
        }

        await loadAll();

        showToast(
            "Élément supprimé avec succès.",
            "success"
        );
    }

    /* TABS */

    document.querySelectorAll(".tab").forEach(function (button) {

        button.addEventListener("click", function () {

            document.querySelectorAll(".tab").forEach(function (tab) {
                tab.classList.remove("active");
            });

            button.classList.add("active");

            state.currentTab =
                button.getAttribute("data-tab");

            searchInput.value = "";

            render();
        });
    });

    /* SEARCH */

    searchInput.addEventListener("input", function () {
        render();
    });

    /* ADD */

    document.getElementById("addBtn").addEventListener("click", function () {
        openModal(null);
    });

    /* CLOSE */

    document.getElementById("closeModal").addEventListener(
        "click",
        closeModal
    );

    document.getElementById("cancelBtn").addEventListener(
        "click",
        closeModal
    );

    modalOverlay.addEventListener("click", function (event) {

        if (event.target === modalOverlay) {
            closeModal();
        }
    });

    /* FORM */

    contentForm.addEventListener("submit", saveContent);

    /* EDIT / DELETE */

    contentArea.addEventListener("click", function (event) {

        const editButton =
            event.target.closest(".edit-btn");

        const deleteButton =
            event.target.closest(".delete-btn");

        if (editButton) {

            const id =
                editButton.getAttribute("data-id");

            openModal(id);

            return;
        }

        if (deleteButton) {

            const id =
                deleteButton.getAttribute("data-id");

            deleteContent(id);
        }
    });

    /* LOGOUT */

    document.getElementById("logoutBtn").addEventListener(
        "click",
        async function () {

            await supabaseClient.auth.signOut();

            window.location.href =
                "../pages/connexion.html";
        }
    );

    /* MOBILE MENU */

    document.getElementById("mobileMenu").addEventListener(
        "click",
        function () {

            document
                .getElementById("sidebar")
                .classList.toggle("open");
        }
    );

    /* ESC */

    document.addEventListener("keydown", function (event) {

        if (event.key === "Escape") {
            closeModal();
        }
    });

    /* START */

    const staff = await checkAuth();

    if (staff) {
        await loadAll();
    }

</script>

</body>
</html>
