<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Gestion — HoriblitiMatch</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body class="staff-page">


<header class="panel-header">

    <a href="../index.html" class="logo">

        <span class="logo-icon">
            H
        </span>

        <span class="logo-text">
            Horibliti<span>Match</span>
        </span>

    </a>


    <div class="panel-actions">

        <a href="index.html">
            ← Panel
        </a>

        <button id="logout">
            Déconnexion
        </button>

    </div>

</header>


<main class="management-page">


<section class="management-header">

    <span class="eyebrow">
        ADMINISTRATION
    </span>

    <h1>
        Gestion du contenu
    </h1>

    <p>
        Ajoutez, modifiez et supprimez les contenus
        visibles sur HoriblitiMatch.
    </p>

</section>


<!-- =========================
     ANNONCES
========================= -->

<section class="management-section">

    <div class="section-heading">

        <div>

            <span class="eyebrow">
                CONTENU
            </span>

            <h2>
                Annonces
            </h2>

        </div>

    </div>


    <form
        id="announcementForm"
        class="management-form"
    >

        <div class="form-group">

            <label for="announcementTitle">
                Titre
            </label>

            <input
                id="announcementTitle"
                type="text"
                placeholder="Titre"
                required
            >

        </div>


        <div class="form-group">

            <label for="announcementContent">
                Contenu
            </label>

            <textarea
                id="announcementContent"
                placeholder="Contenu"
                required
            ></textarea>

        </div>


        <button
            class="button button-primary"
            type="submit"
        >
            Publier l'annonce
        </button>

    </form>


    <div
        id="announcementList"
        class="management-list"
    ></div>

</section>


<!-- =========================
     PARTENAIRES
========================= -->

<section class="management-section">

    <div class="section-heading">

        <div>

            <span class="eyebrow">
                COLLABORATIONS
            </span>

            <h2>
                Partenaires
            </h2>

        </div>

    </div>


    <form
        id="partnerForm"
        class="management-form"
    >

        <div class="form-group">

            <label for="partnerName">
                Nom
            </label>

            <input
                id="partnerName"
                type="text"
                placeholder="Nom du partenaire"
                required
            >

        </div>


        <div class="form-group">

            <label for="partnerDescription">
                Description
            </label>

            <textarea
                id="partnerDescription"
                placeholder="Description"
            ></textarea>

        </div>


        <div class="form-group">

            <label for="partnerLink">
                Lien
            </label>

            <input
                id="partnerLink"
                type="url"
                placeholder="https://..."
            >

        </div>


        <button
            class="button button-primary"
            type="submit"
        >
            Ajouter le partenaire
        </button>

    </form>


    <div
        id="partnerList"
        class="management-list"
    ></div>

</section>


<!-- =========================
     REALISATIONS
========================= -->

<section class="management-section">

    <div class="section-heading">

        <div>

            <span class="eyebrow">
                PORTFOLIO
            </span>

            <h2>
                Réalisations
            </h2>

        </div>

    </div>


    <form
        id="projectForm"
        class="management-form"
    >

        <div class="form-group">

            <label for="projectTitle">
                Titre
            </label>

            <input
                id="projectTitle"
                type="text"
                placeholder="Nom du projet"
                required
            >

        </div>


        <div class="form-group">

            <label for="projectDescription">
                Description
            </label>

            <textarea
                id="projectDescription"
                placeholder="Description du projet"
            ></textarea>

        </div>


        <div class="form-group">

            <label for="projectLink">
                Lien
            </label>

            <input
                id="projectLink"
                type="url"
                placeholder="https://..."
            >

        </div>


        <button
            class="button button-primary"
            type="submit"
        >
            Ajouter la réalisation
        </button>

    </form>


    <div
        id="projectList"
        class="management-list"
    ></div>

</section>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>

<script src="../js/script.js"></script>


<script>

document.addEventListener("DOMContentLoaded", async () => {


    /* =========================
       AUTH
    ========================= */

    const {
        data: {
            session
        }
    } = await supabaseClient.auth.getSession();


    if (!session) {

        window.location.href =
            "../pages/connexion.html";

        return;

    }


    const {
        data: staff
    } = await supabaseClient
        .from("staff")
        .select("id")
        .eq("id", session.user.id)
        .maybeSingle();


    if (!staff) {

        await supabaseClient.auth.signOut();

        window.location.href =
            "../pages/connexion.html";

        return;

    }


    /* =========================
       HELPERS
    ========================= */

    function escapeHTML(value) {

        return String(value ?? "")
            .replace(/[&<>"']/g, character => {

                const entities = {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#039;"
                };

                return entities[character];

            });

    }


    /* =========================
       ANNONCES
    ========================= */

    const announcementForm =
        document.getElementById(
            "announcementForm"
        );


    const announcementList =
        document.getElementById(
            "announcementList"
        );


    async function loadAnnouncements() {

        const {
            data,
            error
        } = await supabaseClient
            .from("annonces")
            .select("*")
            .order("created_at", {
                ascending: false
            });


        if (error) {

            announcementList.innerHTML =
                `<div class="empty-box">
                    Erreur de chargement.
                </div>`;

            return;

        }


        if (!data.length) {

            announcementList.innerHTML =
                `<div class="empty-box">
                    Aucune annonce.
                </div>`;

            return;

        }


        announcementList.innerHTML =
            data.map(item => `

                <div class="management-item">

                    <div>

                        <strong>
                            ${escapeHTML(item.titre)}
                        </strong>

                        <p>
                            ${escapeHTML(item.contenu)}
                        </p>

                    </div>

                    <button
                        class="delete-button"
                        data-table="annonces"
                        data-id="${item.id}"
                    >
                        Supprimer
                    </button>

                </div>

            `).join("");

    }


    announcementForm.addEventListener(
        "submit",
        async event => {

            event.preventDefault();


            const titre =
                document
                    .getElementById(
                        "announcementTitle"
                    )
                    .value
                    .trim();


            const contenu =
                document
                    .getElementById(
                        "announcementContent"
                    )
                    .value
                    .trim();


            const {
                error
            } = await supabaseClient
                .from("annonces")
                .insert({
                    titre,
                    categorie: "Information",
                    contenu
                });


            if (error) {

                alert(
                    "Erreur lors de la publication."
                );

                console.error(error);

                return;

            }


            announcementForm.reset();

            loadAnnouncements();

        }
    );


    /* =========================
       PARTENAIRES
    ========================= */

    const partnerForm =
        document.getElementById(
            "partnerForm"
        );


    const partnerList =
        document.getElementById(
            "partnerList"
        );


    async function loadPartners() {

        const {
            data,
            error
        } = await supabaseClient
            .from("partenaires")
            .select("*")
            .order("created_at", {
                ascending: false
            });


        if (error) {

            partnerList.innerHTML =
                `<div class="empty-box">
                    Erreur de chargement.
                </div>`;

            return;

        }


        if (!data.length) {

            partnerList.innerHTML =
                `<div class="empty-box">
                    Aucun partenaire.
                </div>`;

            return;

        }


        partnerList.innerHTML =
            data.map(item => `

                <div class="management-item">

                    <div>

                        <strong>
                            ${escapeHTML(item.nom)}
                        </strong>

                        <p>
                            ${escapeHTML(
                                item.description || ""
                            )}
                        </p>

                    </div>

                    <button
                        class="delete-button"
                        data-table="partenaires"
                        data-id="${item.id}"
                    >
                        Supprimer
                    </button>

                </div>

            `).join("");

    }


    partnerForm.addEventListener(
        "submit",
        async event => {

            event.preventDefault();


            const nom =
                document
                    .getElementById(
                        "partnerName"
                    )
                    .value
                    .trim();


            const description =
                document
                    .getElementById(
                        "partnerDescription"
                    )
                    .value
                    .trim();


            const lien =
                document
                    .getElementById(
                        "partnerLink"
                    )
                    .value
                    .trim();


            const {
                error
            } = await supabaseClient
                .from("partenaires")
                .insert({
                    nom,
                    description,
                    lien
                });


            if (error) {

                alert(
                    "Erreur lors de l'ajout du partenaire."
                );

                console.error(error);

                return;

            }


            partnerForm.reset();

            loadPartners();

        }
    );


    /* =========================
       REALISATIONS
    ========================= */

    const projectForm =
        document.getElementById(
            "projectForm"
        );


    const projectList =
        document.getElementById(
            "projectList"
        );


    async function loadProjects() {

        const {
            data,
            error
        } = await supabaseClient
            .from("realisations")
            .select("*")
            .order("created_at", {
                ascending: false
            });


        if (error) {

            projectList.innerHTML =
                `<div class="empty-box">
                    Erreur de chargement.
                </div>`;

            return;

        }


        if (!data.length) {

            projectList.innerHTML =
                `<div class="empty-box">
                    Aucune réalisation.
                </div>`;

            return;

        }


        projectList.innerHTML =
            data.map(item => `

                <div class="management-item">

                    <div>

                        <strong>
                            ${escapeHTML(item.titre)}
                        </strong>

                        <p>
                            ${escapeHTML(
                                item.description || ""
                            )}
                        </p>

                    </div>

                    <button
                        class="delete-button"
                        data-table="realisations"
                        data-id="${item.id}"
                    >
                        Supprimer
                    </button>

                </div>

            `).join("");

    }


    projectForm.addEventListener(
        "submit",
        async event => {

            event.preventDefault();


            const titre =
                document
                    .getElementById(
                        "projectTitle"
                    )
                    .value
                    .trim();


            const description =
                document
                    .getElementById(
                        "projectDescription"
                    )
                    .value
                    .trim();


            const lien =
                document
                    .getElementById(
                        "projectLink"
                    )
                    .value
                    .trim();


            const {
                error
            } = await supabaseClient
                .from("realisations")
                .insert({
                    titre,
                    description,
                    lien
                });


            if (error) {

                alert(
                    "Erreur lors de l'ajout du projet."
                );

                console.error(error);

                return;

            }


            projectForm.reset();

            loadProjects();

        }
    );


    /* =========================
       SUPPRESSION GENERALE
    ========================= */

    document.addEventListener(
        "click",
        async event => {

            const button =
                event.target.closest(
                    ".delete-button"
                );


            if (!button) {
                return;
            }


            const confirmed =
                confirm(
                    "Voulez-vous vraiment supprimer cet élément ?"
                );


            if (!confirmed) {
                return;
            }


            const {
                error
            } = await supabaseClient
                .from(button.dataset.table)
                .delete()
                .eq(
                    "id",
                    button.dataset.id
                );


            if (error) {

                alert(
                    "Impossible de supprimer cet élément."
                );

                console.error(error);

                return;

            }


            if (
                button.dataset.table ===
                "annonces"
            ) {
                loadAnnouncements();
            }


            if (
                button.dataset.table ===
                "partenaires"
            ) {
                loadPartners();
            }


            if (
                button.dataset.table ===
                "realisations"
            ) {
                loadProjects();
            }

        }
    );


    /* =========================
       LOGOUT
    ========================= */

    document
        .getElementById("logout")
        .addEventListener(
            "click",
            async () => {

                await supabaseClient.auth.signOut();

                window.location.href =
                    "../pages/connexion.html";

            }
        );


    /* =========================
       INITIALISATION
    ========================= */

    await loadAnnouncements();

    await loadPartners();

    await loadProjects();

});

</script>

</body>
</html>
