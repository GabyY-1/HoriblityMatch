<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion — HoriblitiMatch</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0b0e14;
            --sidebar: #0f131b;
            --surface: #131923;
            --surface-2: #181f2b;
            --input: #0c1118;
            --border: #273040;
            --text: #f3f5f8;
            --muted: #8993a5;
            --accent: #795cff;
            --accent2: #5d8dff;
            --danger: #ef6674;
            --success: #43d18b;
        }

        html {
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .app {
            min-height: 100vh;
        }

        /* SIDEBAR */

        .sidebar {
            position: fixed;
            z-index: 100;
            top: 0;
            left: 0;
            bottom: 0;
            width: 250px;
            padding: 24px 16px;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
        }

        .brand {
            padding: 5px 10px 28px;
        }

        .brand-title {
            font-size: 20px;
            font-weight: 700;
        }

        .brand-subtitle {
            margin-top: 5px;
            color: var(--muted);
            font-size: 12px;
        }

        .nav-title {
            margin: 17px 10px 9px;
            color: #606a7c;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .nav {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .nav a {
            display: block;
            padding: 12px;
            border: 1px solid transparent;
            border-radius: 9px;
            color: #9ba5b7;
            font-size: 14px;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }

        .nav a:hover {
            background: #161c27;
            color: #fff;
        }

        .nav a.active {
            background: rgba(121, 92, 255, 0.13);
            border-color: rgba(121, 92, 255, 0.2);
            color: #fff;
        }

        .sidebar-bottom {
            position: absolute;
            right: 16px;
            bottom: 18px;
            left: 16px;
        }

        .site-link,
        .logout-btn {
            width: 100%;
            display: block;
            padding: 11px 12px;
            border-radius: 9px;
            font-size: 13px;
            text-align: left;
        }

        .site-link {
            margin-bottom: 8px;
            border: 1px solid var(--border);
            color: #aeb7c7;
        }

        .site-link:hover {
            background: #161c27;
            color: #fff;
        }

        .logout-btn {
            border: 1px solid rgba(239, 102, 116, 0.2);
            background: rgba(239, 102, 116, 0.07);
            color: #ef8c97;
        }

        .logout-btn:hover {
            background: rgba(239, 102, 116, 0.12);
        }

        /* MAIN */

        .main {
            min-height: 100vh;
            margin-left: 250px;
        }

        .topbar {
            position: sticky;
            z-index: 50;
            top: 0;
            min-height: 74px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            background: rgba(11, 14, 20, 0.92);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(12px);
        }

        .topbar h1 {
            font-size: 20px;
        }

        .topbar p {
            margin-top: 4px;
            color: var(--muted);
            font-size: 12px;
        }

        .user-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 35px;
            height: 35px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
            font-size: 13px;
            font-weight: 700;
        }

        .user-info strong {
            display: block;
            font-size: 13px;
        }

        .user-info span {
            display: block;
            margin-top: 2px;
            color: var(--muted);
            font-size: 11px;
        }

        .mobile-menu {
            display: none;
            width: 38px;
            height: 38px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            color: #fff;
            font-size: 18px;
        }

        /* CONTENT */

        .content {
            width: 100%;
            max-width: 1500px;
            margin: 0 auto;
            padding: 30px;
        }

        /* TABS */

        .tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 22px;
        }

        .tab {
            padding: 11px 16px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: var(--surface);
            color: #9ca6b7;
            transition: 0.2s;
        }

        .tab:hover {
            background: var(--surface-2);
            color: #fff;
        }

        .tab.active {
            border-color: rgba(121, 92, 255, 0.35);
            background: rgba(121, 92, 255, 0.14);
            color: #fff;
        }

        .tab-count {
            display: inline-flex;
            min-width: 20px;
            height: 20px;
            align-items: center;
            justify-content: center;
            margin-left: 5px;
            padding: 0 5px;
            border-radius: 20px;
            background: #222a3a;
            font-size: 10px;
        }

        /* PANEL */

        .panel {
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: var(--surface);
            box-shadow: 0 18px 55px rgba(0, 0, 0, 0.25);
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 18px;
            border-bottom: 1px solid var(--border);
        }

        .search {
            position: relative;
            flex: 1;
        }

        .search-icon {
            position: absolute;
            top: 50%;
            left: 13px;
            transform: translateY(-50%);
            color: #657083;
            pointer-events: none;
        }

        .search input {
            width: 100%;
            padding: 12px 14px 12px 38px;
            border: 1px solid var(--border);
            border-radius: 9px;
            outline: none;
            background: var(--input);
            color: #fff;
        }

        .search input:focus {
            border-color: rgba(121, 92, 255, 0.55);
        }

        .primary-btn {
            padding: 11px 17px;
            border: 0;
            border-radius: 9px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
            font-weight: 700;
            transition: 0.2s;
        }

        .primary-btn:hover {
            filter: brightness(1.08);
            transform: translateY(-1px);
        }

        .primary-btn:disabled {
            cursor: not-allowed;
            opacity: 0.6;
            transform: none;
        }

        /* TABLE */

        .table-container {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 760px;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 15px 18px;
            border-bottom: 1px solid #202735;
            text-align: left;
        }

        th {
            color: #707a8c;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        td {
            color: #dce1e9;
            font-size: 13px;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.018);
        }

        tbody tr:last-child td {
            border-bottom: 0;
        }

        .title-cell {
            max-width: 370px;
        }

        .title-cell strong {
            display: block;
            margin-bottom: 5px;
            color: #fff;
            font-size: 14px;
        }

        .title-cell span {
            display: block;
            overflow: hidden;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.4;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .badge {
            display: inline-flex;
            padding: 5px 9px;
            border-radius: 20px;
            background: #202838;
            color: #b5bed0;
            font-size: 11px;
        }

        .date {
            color: #778193;
            font-size: 12px;
        }

        .actions {
            display: flex;
            gap: 7px;
        }

        .action-btn {
            padding: 7px 10px;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: #171e2a;
            color: #b7c0cf;
            font-size: 11px;
        }

        .action-btn:hover {
            background: #202838;
            color: #fff;
        }

        .action-btn.delete {
            border-color: rgba(239, 102, 116, 0.18);
            color: #ea818c;
        }

        .action-btn.delete:hover {
            background: rgba(239, 102, 116, 0.1);
        }

        .empty,
        .loading {
            padding: 65px 20px;
            text-align: center;
            color: var(--muted);
        }

        .empty strong {
            display: block;
            margin-bottom: 7px;
            color: #e0e4eb;
        }

        /* MODAL */

        .modal-overlay {
            position: fixed;
            z-index: 200;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.74);
            backdrop-filter: blur(5px);
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            width: min(600px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 15px;
            background: #111722;
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.55);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 19px 20px;
            border-bottom: 1px solid var(--border);
        }

        .modal-header h2 {
            font-size: 18px;
        }

        .close-btn {
            width: 32px;
            height: 32px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #171e2a;
            color: #aeb7c6;
            font-size: 18px;
        }

        .close-btn:hover {
            background: #202838;
            color: #fff;
        }

        .modal-body {
            padding: 20px;
        }

        .field {
            margin-bottom: 17px;
        }

        .field:last-child {
            margin-bottom: 0;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            color: #adb6c6;
            font-size: 12px;
        }

        .field input,
        .field textarea,
        .field select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            background: var(--input);
            color: #fff;
        }

        .field input:focus,
        .field textarea:focus,
        .field select:focus {
            border-color: rgba(121, 92, 255, 0.55);
        }

        .field textarea {
            min-height: 145px;
            resize: vertical;
            line-height: 1.5;
        }

        .field small {
            display: block;
            margin-top: 6px;
            color: #626d7e;
            font-size: 10px;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            padding: 16px 20px;
            border-top: 1px solid var(--border);
        }

        .secondary-btn {
            padding: 10px 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #171e29;
            color: #adb6c5;
        }

        .secondary-btn:hover {
            color: #fff;
        }

        /* TOAST */

        .toast {
            position: fixed;
            z-index: 300;
            right: 22px;
            bottom: 22px;
            max-width: 380px;
            padding: 13px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #171e29;
            color: #fff;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
            transition: 0.25s;
            font-size: 13px;
        }

        .toast.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.success {
            border-color: rgba(67, 209, 139, 0.3);
        }

        .toast.error {
            border-color: rgba(239, 102, 116, 0.35);
            color: #ff9da7;
        }

        /* MOBILE */

        @media (max-width: 900px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.25s ease;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main {
                margin-left: 0;
            }

            .mobile-menu {
                display: block;
            }

            .topbar {
                padding: 0 18px;
            }

            .content {
                padding: 20px 15px;
            }

            .user-info {
                display: none;
            }
        }

        @media (max-width: 600px) {
            .topbar h1 {
                font-size: 17px;
            }

            .topbar p {
                display: none;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .search {
                width: 100%;
            }

            .primary-btn {
                width: 100%;
            }

            .tabs {
                display: grid;
                grid-template-columns: 1fr;
            }

            .tab {
                width: 100%;
                text-align: left;
            }

            .modal-footer {
                flex-direction: column-reverse;
            }

            .modal-footer button {
                width: 100%;
            }

            .toast {
                right: 12px;
                bottom: 12px;
                left: 12px;
                max-width: none;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <aside class="sidebar" id="sidebar">

        <div class="brand">
            <div class="brand-title">HoriblitiMatch</div>
            <div class="brand-subtitle">Administration</div>
        </div>

        <div class="nav-title">Principal</div>

        <nav class="nav">
            <a href="index.html">Tableau de bord</a>
            <a href="gestion.html" class="active">Gestion</a>
            <a href="medias.html">Médias</a>
        </nav>

        <div class="nav-title">Administration</div>

        <nav class="nav">
            <a href="equipe.html">Équipe</a>
            <a href="parametres.html">Paramètres</a>
        </nav>

        <div class="sidebar-bottom">
            <a class="site-link" href="../index.html" target="_blank">
                ↗ Voir le site
            </a>

            <button type="button" class="logout-btn" id="logoutButton">
                Se déconnecter
            </button>
        </div>

    </aside>

    <main class="main">

        <header class="topbar">

            <div>
                <h1>Gestion du contenu</h1>
                <p>Gérez les annonces, réalisations et partenaires.</p>
            </div>

            <div class="user-box">

                <div class="avatar" id="userAvatar">H</div>

                <div class="user-info">
                    <strong id="userName">Staff</strong>
                    <span id="userRole">Staff</span>
                </div>

                <button
                    type="button"
                    class="mobile-menu"
                    id="mobileMenu"
                    aria-label="Ouvrir le menu"
                >
                    ☰
                </button>

            </div>

        </header>

        <section class="content">

            <div class="tabs">

                <button
                    type="button"
                    class="tab active"
                    data-tab="annonces"
                >
                    Annonces
                    <span class="tab-count" id="annoncesCount">0</span>
                </button>

                <button
                    type="button"
                    class="tab"
                    data-tab="realisations"
                >
                    Réalisations
                    <span class="tab-count" id="realisationsCount">0</span>
                </button>

                <button
                    type="button"
                    class="tab"
                    data-tab="partenaires"
                >
                    Partenaires
                    <span class="tab-count" id="partenairesCount">0</span>
                </button>

            </div>

            <div class="panel">

                <div class="toolbar">

                    <div class="search">
                        <span class="search-icon">⌕</span>

                        <input
                            id="searchInput"
                            type="search"
                            placeholder="Rechercher..."
                            autocomplete="off"
                        >
                    </div>

                    <button
                        type="button"
                        class="primary-btn"
                        id="addButton"
                    >
                        + Ajouter
                    </button>

                </div>

                <div id="tableContainer">
                    <div class="loading">
                        Chargement...
                    </div>
                </div>

            </div>

        </section>

    </main>

</div>

<!-- MODAL -->

<div class="modal-overlay" id="modalOverlay">

    <div class="modal">

        <div class="modal-header">

            <h2 id="modalTitle">Ajouter</h2>

            <button
                type="button"
                class="close-btn"
                id="closeModalButton"
                aria-label="Fermer"
            >
                ×
            </button>

        </div>

        <form id="contentForm">

            <div class="modal-body" id="formFields"></div>

            <div class="modal-footer">

                <button
                    type="button"
                    class="secondary-btn"
                    id="cancelButton"
                >
                    Annuler
                </button>

                <button
                    type="submit"
                    class="primary-btn"
                    id="submitButton"
                >
                    Enregistrer
                </button>

            </div>

        </form>

    </div>

</div>

<div class="toast" id="toast"></div>

<script type="module">

    import { supabaseClient } from "../js/supabase.js";

    const state = {
        tab: "annonces",
        editingId: null,
        loading: false,
        data: {
            annonces: [],
            realisations: [],
            partenaires: []
        }
    };

    const elements = {
        sidebar: document.getElementById("sidebar"),
        mobileMenu: document.getElementById("mobileMenu"),
        logoutButton: document.getElementById("logoutButton"),

        userAvatar: document.getElementById("userAvatar"),
        userName: document.getElementById("userName"),
        userRole: document.getElementById("userRole"),

        searchInput: document.getElementById("searchInput"),
        addButton: document.getElementById("addButton"),
        tableContainer: document.getElementById("tableContainer"),

        annoncesCount: document.getElementById("annoncesCount"),
        realisationsCount: document.getElementById("realisationsCount"),
        partenairesCount: document.getElementById("partenairesCount"),

        modalOverlay: document.getElementById("modalOverlay"),
        modalTitle: document.getElementById("modalTitle"),
        closeModalButton: document.getElementById("closeModalButton"),
        cancelButton: document.getElementById("cancelButton"),
        contentForm: document.getElementById("contentForm"),
        formFields: document.getElementById("formFields"),
        submitButton: document.getElementById("submitButton"),

        toast: document.getElementById("toast")
    };

    let toastTimeout = null;

    /* =========================
       UTILITAIRES
    ========================= */

    function escapeHtml(value) {

        if (value === null || value === undefined) {
            return "";
        }

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function formatDate(value) {

        if (!value) {
            return "—";
        }

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
            return "—";
        }

        return date.toLocaleDateString("fr-FR", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        });
    }

    function getInitial(name, email) {

        const text = String(name || email || "H").trim();

        if (!text) {
            return "H";
        }

        return text.charAt(0).toUpperCase();
    }

    function showToast(message, type) {

        clearTimeout(toastTimeout);

        elements.toast.textContent = message;

        elements.toast.className = "toast visible";

        if (type) {
            elements.toast.classList.add(type);
        }

        toastTimeout = setTimeout(function () {
            elements.toast.className = "toast";
        }, 3500);
    }

    function getCurrentItems() {
        return state.data[state.tab] || [];
    }

    function getSingularName() {

        if (state.tab === "annonces") {
            return "une annonce";
        }

        if (state.tab === "realisations") {
            return "une réalisation";
        }

        return "un partenaire";
    }

    /* =========================
       AUTH
    ========================= */

    async function checkAuth() {

        try {

            const sessionResult =
                await supabaseClient.auth.getSession();

            if (
                sessionResult.error ||
                !sessionResult.data ||
                !sessionResult.data.session
            ) {
                window.location.href = "../pages/connexion.html";
                return false;
            }

            const session =
                sessionResult.data.session;

            const staffResult =
                await supabaseClient
                    .from("staff")
                    .select("id,email,nom,role")
                    .eq("id", session.user.id)
                    .maybeSingle();

            if (
                staffResult.error ||
                !staffResult.data
            ) {
                await supabaseClient.auth.signOut();
                window.location.href = "../pages/connexion.html";
                return false;
            }

            const staff = staffResult.data;

            elements.userName.textContent =
                staff.nom || staff.email || "Staff";

            elements.userRole.textContent =
                staff.role === "admin"
                    ? "Administrateur"
                    : "Staff";

            elements.userAvatar.textContent =
                getInitial(staff.nom, staff.email);

            return true;

        } catch (error) {

            console.error(error);

            window.location.href = "../pages/connexion.html";

            return false;
        }
    }

    /* =========================
       CHARGEMENT
    ========================= */

    async function loadData() {

        state.loading = true;

        elements.tableContainer.innerHTML =
            '<div class="loading">Chargement des données...</div>';

        try {

            const annoncesRequest =
                await supabaseClient
                    .from("annonces")
                    .select(
                        "id,titre,categorie,contenu,created_at,updated_at"
                    )
                    .order("created_at", {
                        ascending: false
                    });

            const realisationsRequest =
                await supabaseClient
                    .from("realisations")
                    .select(
                        "id,titre,description,lien,created_at,updated_at"
                    )
                    .order("created_at", {
                        ascending: false
                    });

            const partenairesRequest =
                await supabaseClient
                    .from("partenaires")
                    .select(
                        "id,nom,description,lien,created_at,updated_at"
                    )
                    .order("created_at", {
                        ascending: false
                    });

            if (annoncesRequest.error) {
                throw new Error(
                    "Erreur annonces : " +
                    annoncesRequest.error.message
                );
            }

            if (realisationsRequest.error) {
                throw new Error(
                    "Erreur réalisations : " +
                    realisationsRequest.error.message
                );
            }

            if (partenairesRequest.error) {
                throw new Error(
                    "Erreur partenaires : " +
                    partenairesRequest.error.message
                );
            }

            state.data.annonces =
                annoncesRequest.data || [];

            state.data.realisations =
                realisationsRequest.data || [];

            state.data.partenaires =
                partenairesRequest.data || [];

            updateCounters();
            renderTable();

        } catch (error) {

            console.error(error);

            elements.tableContainer.innerHTML =
                '<div class="empty">' +
                    '<strong>Impossible de charger les données</strong>' +
                    '<span>' +
                        escapeHtml(error.message) +
                    '</span>' +
                '</div>';

            showToast(
                "Erreur lors du chargement.",
                "error"
            );

        } finally {

            state.loading = false;
        }
    }

    function updateCounters() {

        elements.annoncesCount.textContent =
            state.data.annonces.length;

        elements.realisationsCount.textContent =
            state.data.realisations.length;

        elements.partenairesCount.textContent =
            state.data.partenaires.length;
    }

    /* =========================
       RECHERCHE
    ========================= */

    function getFilteredItems() {

        const items = getCurrentItems();

        const query =
            elements.searchInput.value
                .trim()
                .toLowerCase();

        if (!query) {
            return items;
        }

        return items.filter(function (item) {

            let text = "";

            if (state.tab === "annonces") {

                text =
                    (item.titre || "") +
                    " " +
                    (item.categorie || "") +
                    " " +
                    (item.contenu || "");

            } else if (state.tab === "realisations") {

                text =
                    (item.titre || "") +
                    " " +
                    (item.description || "") +
                    " " +
                    (item.lien || "");

            } else {

                text =
                    (item.nom || "") +
                    " " +
                    (item.description || "") +
                    " " +
                    (item.lien || "");
            }

            return text.toLowerCase().includes(query);
        });
    }

    /* =========================
       AFFICHAGE
    ========================= */

    function renderTable() {

        const items = getFilteredItems();

        if (items.length === 0) {

            elements.tableContainer.innerHTML =
                '<div class="empty">' +
                    '<strong>Aucun élément</strong>' +
                    '<span>' +
                        'Aucun contenu ne correspond à votre recherche.' +
                    '</span>' +
                '</div>';

            return;
        }

        let html =
            '<div class="table-container">' +
                '<table>' +
                    '<thead>' +
                        '<tr>';

        if (state.tab === "annonces") {

            html +=
                '<th>Titre</th>' +
                '<th>Catégorie</th>' +
                '<th>Création</th>' +
                '<th>Modification</th>' +
                '<th>Actions</th>';

        } else if (state.tab === "realisations") {

            html +=
                '<th>Réalisation</th>' +
                '<th>Lien</th>' +
                '<th>Création</th>' +
                '<th>Modification</th>' +
                '<th>Actions</th>';

        } else {

            html +=
                '<th>Partenaire</th>' +
                '<th>Lien</th>' +
                '<th>Création</th>' +
                '<th>Modification</th>' +
                '<th>Actions</th>';
        }

        html +=
                        '</tr>' +
                    '</thead>' +
                    '<tbody>';

        items.forEach(function (item) {

            if (state.tab === "annonces") {

                html +=
                    '<tr>' +
                        '<td class="title-cell">' +
                            '<strong>' +
                                escapeHtml(item.titre) +
                            '</strong>' +
                            '<span>' +
                                escapeHtml(item.contenu) +
                            '</span>' +
                        '</td>' +

                        '<td>' +
                            '<span class="badge">' +
                                escapeHtml(item.categorie) +
                            '</span>' +
                        '</td>' +

                        '<td class="date">' +
                            formatDate(item.created_at) +
                        '</td>' +

                        '<td class="date">' +
                            formatDate(item.updated_at) +
                        '</td>' +

                        '<td>' +
                            actionButtons(item.id) +
                        '</td>' +

                    '</tr>';

            } else if (state.tab === "realisations") {

                html +=
                    '<tr>' +

                        '<td class="title-cell">' +
                            '<strong>' +
                                escapeHtml(item.titre) +
                            '</strong>' +
                            '<span>' +
                                escapeHtml(item.description || "") +
                            '</span>' +
                        '</td>' +

                        '<td>' +
                            linkButton(item.lien) +
                        '</td>' +

                        '<td class="date">' +
                            formatDate(item.created_at) +
                        '</td>' +

                        '<td class="date">' +
                            formatDate(item.updated_at) +
                        '</td>' +

                        '<td>' +
                            actionButtons(item.id) +
                        '</td>' +

                    '</tr>';

            } else {

                html +=
                    '<tr>' +

                        '<td class="title-cell">' +
                            '<strong>' +
                                escapeHtml(item.nom) +
                            '</strong>' +
                            '<span>' +
                                escapeHtml(item.description || "") +
                            '</span>' +
                        '</td>' +

                        '<td>' +
                            linkButton(item.lien) +
                        '</td>' +

                        '<td class="date">' +
                            formatDate(item.created_at) +
                        '</td>' +

                        '<td class="date">' +
                            formatDate(item.updated_at) +
                        '</td>' +

                        '<td>' +
                            actionButtons(item.id) +
                        '</td>' +

                    '</tr>';
            }
        });

        html +=
                    '</tbody>' +
                '</table>' +
            '</div>';

        elements.tableContainer.innerHTML = html;
    }

    function actionButtons(id) {

        return (
            '<div class="actions">' +

                '<button ' +
                    'type="button" ' +
                    'class="action-btn edit-action" ' +
                    'data-id="' +
                    escapeHtml(id) +
                '">' +
                    'Modifier' +
                '</button>' +

                '<button ' +
                    'type="button" ' +
                    'class="action-btn delete delete-action" ' +
                    'data-id="' +
                    escapeHtml(id) +
                '">' +
                    'Supprimer' +
                '</button>' +

            '</div>'
        );
    }

    function linkButton(link) {

        if (!link) {
            return '<span class="date">Aucun lien</span>';
        }

        const value = String(link).trim();

        if (
            !value.startsWith("http://") &&
            !value.startsWith("https://")
        ) {
            return (
                '<span class="date">' +
                    escapeHtml(value) +
                '</span>'
            );
        }

        return (
            '<a ' +
                'href="' +
                    escapeHtml(value) +
                '" ' +
                'target="_blank" ' +
                'rel="noopener noreferrer" ' +
                'style="color:#9f8cff;font-size:12px;"' +
            '>' +
                'Ouvrir ↗' +
            '</a>'
        );
    }

    /* =========================
       MODAL
    ========================= */

    function openModal(id) {

        state.editingId = id || null;

        let item = null;

        if (state.editingId) {

            item = getCurrentItems().find(function (entry) {
                return String(entry.id) === String(id);
            });

            if (!item) {
                showToast(
                    "Élément introuvable.",
                    "error"
                );
                return;
            }
        }

        const editMode = Boolean(item);

        elements.modalTitle.textContent =
            editMode
                ? "Modifier " + getSingularName()
                : "Ajouter " + getSingularName();

        buildForm(item);

        elements.modalOverlay.classList.add("open");

        document.body.style.overflow = "hidden";

        const firstField =
            elements.formFields.querySelector("input, textarea, select");

        if (firstField) {
            setTimeout(function () {
                firstField.focus();
            }, 50);
        }
    }

    function buildForm(item) {

        if (state.tab === "annonces") {

            elements.formFields.innerHTML =
                '<div class="field">' +

                    '<label for="fieldTitle">' +
                        'Titre *' +
                    '</label>' +

                    '<input ' +
                        'id="fieldTitle" ' +
                        'type="text" ' +
                        'maxlength="200" ' +
                        'required ' +
                        'value="' +
                            escapeHtml(item ? item.titre : "") +
                        '"' +
                    '>' +

                '</div>' +

                '<div class="field">' +

                    '<label for="fieldCategory">' +
                        'Catégorie *' +
                    '</label>' +

                    '<select ' +
                        'id="fieldCategory" ' +
                        'required' +
                    '>' +

                        categoryOption(
                            "Information",
                            item ? item.categorie : ""
                        ) +

                        categoryOption(
                            "Actualité",
                            item ? item.categorie : ""
                        ) +

                        categoryOption(
                            "Nouveauté",
                            item ? item.categorie : ""
                        ) +

                        categoryOption(
                            "Projet",
                            item ? item.categorie : ""
                        ) +

                        categoryOption(
                            "Autre",
                            item ? item.categorie : ""
                        ) +

                    '</select>' +

                '</div>' +

                '<div class="field">' +

                    '<label for="fieldContent">' +
                        'Contenu *' +
                    '</label>' +

                    '<textarea ' +
                        'id="fieldContent" ' +
                        'required' +
                    '>' +
                        escapeHtml(item ? item.contenu : "") +
                    '</textarea>' +

                '</div>';

            return;
        }

        if (state.tab === "realisations") {

            elements.formFields.innerHTML =
                '<div class="field">' +

                    '<label for="fieldTitle">' +
                        'Titre *' +
                    '</label>' +

                    '<input ' +
                        'id="fieldTitle" ' +
                        'type="text" ' +
                        'maxlength="200" ' +
                        'required ' +
                        'value="' +
                            escapeHtml(item ? item.titre : "") +
                        '"' +
                    '>' +

                '</div>' +

                '<div class="field">' +

                    '<label for="fieldDescription">' +
                        'Description' +
                    '</label>' +

                    '<textarea id="fieldDescription">' +
                        escapeHtml(item ? item.description : "") +
                    '</textarea>' +

                '</div>' +

                '<div class="field">' +

                    '<label for="fieldLink">' +
                        'Lien du projet' +
                    '</label>' +

                    '<input ' +
                        'id="fieldLink" ' +
                        'type="url" ' +
                        'placeholder="https://..." ' +
                        'value="' +
                            escapeHtml(item ? item.lien : "") +
                        '"' +
                    '>' +

                    '<small>' +
                        'Optionnel.' +
                    '</small>' +

                '</div>';

            return;
        }

        elements.formFields.innerHTML =
            '<div class="field">' +

                '<label for="fieldName">' +
                    'Nom du partenaire *' +
                '</label>' +

                '<input ' +
                    'id="fieldName" ' +
                    'type="text" ' +
                    'maxlength="200" ' +
                    'required ' +
                    'value="' +
                        escapeHtml(item ? item.nom : "") +
                    '"' +
                '>' +

            '</div>' +

            '<div class="field">' +

                '<label for="fieldDescription">' +
                    'Description' +
                '</label>' +

                '<textarea id="fieldDescription">' +
                    escapeHtml(item ? item.description : "") +
                '</textarea>' +

            '</div>' +

            '<div class="field">' +

                '<label for="fieldLink">' +
                    'Lien' +
                '</label>' +

                '<input ' +
                    'id="fieldLink" ' +
                    'type="url" ' +
                    'placeholder="https://..." ' +
                    'value="' +
                        escapeHtml(item ? item.lien : "") +
                    '"' +
                '>' +

                '<small>' +
                    'Optionnel.' +
                '</small>' +

            '</div>';
    }

    function categoryOption(value, selected) {

        const selectedAttribute =
            value === selected
                ? " selected"
                : "";

        return (
            '<option value="' +
                escapeHtml(value) +
                '"' +
                selectedAttribute +
            '>' +
                escapeHtml(value) +
            '</option>'
        );
    }

    function closeModal() {

        elements.modalOverlay.classList.remove("open");

        document.body.style.overflow = "";

        state.editingId = null;

        elements.contentForm.reset();
        elements.formFields.innerHTML = "";
    }

    /* =========================
       ENREGISTREMENT
    ========================= */

    async function saveContent(event) {

        event.preventDefault();

        if (state.loading) {
            return;
        }

        state.loading = true;

        elements.submitButton.disabled = true;
        elements.submitButton.textContent = "Enregistrement...";

        try {

            let payload = {};

            if (state.tab === "annonces") {

                const title =
                    document
                        .getElementById("fieldTitle")
                        .value
                        .trim();

                const category =
                    document
                        .getElementById("fieldCategory")
                        .value
                        .trim();

                const content =
                    document
                        .getElementById("fieldContent")
                        .value
                        .trim();

                if (!title || !category || !content) {
                    throw new Error(
                        "Remplis tous les champs obligatoires."
                    );
                }

                payload = {
                    titre: title,
                    categorie: category,
                    contenu: content
                };

            } else if (state.tab === "realisations") {

                const title =
                    document
                        .getElementById("fieldTitle")
                        .value
                        .trim();

                const description =
                    document
                        .getElementById("fieldDescription")
                        .value
                        .trim();

                const link =
                    document
                        .getElementById("fieldLink")
                        .value
                        .trim();

                if (!title) {
                    throw new Error(
                        "Le titre est obligatoire."
                    );
                }

                payload = {
                    titre: title,
                    description: description || null,
                    lien: link || null
                };

            } else {

                const name =
                    document
                        .getElementById("fieldName")
                        .value
                        .trim();

                const description =
                    document
                        .getElementById("fieldDescription")
                        .value
                        .trim();

                const link =
                    document
                        .getElementById("fieldLink")
                        .value
                        .trim();

                if (!name) {
                    throw new Error(
                        "Le nom du partenaire est obligatoire."
                    );
                }

                payload = {
                    nom: name,
                    description: description || null,
                    lien: link || null
                };
            }

            let result;

            if (state.editingId) {

                result =
                    await supabaseClient
                        .from(state.tab)
                        .update(payload)
                        .eq("id", state.editingId);

            } else {

                result =
                    await supabaseClient
                        .from(state.tab)
                        .insert(payload);
            }

            if (result.error) {
                throw result.error;
            }

            closeModal();

            await loadData();

            showToast(
                state.editingId
                    ? "Modification effectuée."
                    : "Élément ajouté.",
                "success"
            );

        } catch (error) {

            console.error(error);

            showToast(
                error.message ||
                "Une erreur est survenue.",
                "error"
            );

        } finally {

            state.loading = false;

            elements.submitButton.disabled = false;
            elements.submitButton.textContent =
                "Enregistrer";
        }
    }

    /* =========================
       SUPPRESSION
    ========================= */

    async function deleteContent(id) {

        if (state.loading) {
            return;
        }

        const item =
            getCurrentItems().find(function (entry) {
                return String(entry.id) === String(id);
            });

        if (!item) {
            showToast(
                "Élément introuvable.",
                "error"
            );
            return;
        }

        let name =
            state.tab === "partenaires"
                ? item.nom
                : item.titre;

        const confirmed =
            window.confirm(
                'Supprimer "' +
                name +
                '" ?\n\n' +
                "Cette action est définitive."
            );

        if (!confirmed) {
            return;
        }

        state.loading = true;

        try {

            const result =
                await supabaseClient
                    .from(state.tab)
                    .delete()
                    .eq("id", id);

            if (result.error) {
                throw result.error;
            }

            await loadData();

            showToast(
                "Élément supprimé.",
                "success"
            );

        } catch (error) {

            console.error(error);

            showToast(
                error.message ||
                "Impossible de supprimer cet élément.",
                "error"
            );

        } finally {

            state.loading = false;
        }
    }

    /* =========================
       ÉVÉNEMENTS
    ========================= */

    document.querySelectorAll(".tab").forEach(
        function (tabButton) {

            tabButton.addEventListener(
                "click",
                function () {

                    if (state.loading) {
                        return;
                    }

                    document
                        .querySelectorAll(".tab")
                        .forEach(function (button) {
                            button.classList.remove("active");
                        });

                    tabButton.classList.add("active");

                    state.tab =
                        tabButton.dataset.tab;

                    elements.searchInput.value = "";

                    renderTable();
                }
            );
        }
    );

    elements.searchInput.addEventListener(
        "input",
        function () {
            renderTable();
        }
    );

    elements.addButton.addEventListener(
        "click",
        function () {

            if (state.loading) {
                return;
            }

            openModal(null);
        }
    );

    elements.closeModalButton.addEventListener(
        "click",
        function () {
            closeModal();
        }
    );

    elements.cancelButton.addEventListener(
        "click",
        function () {
            closeModal();
        }
    );

    elements.modalOverlay.addEventListener(
        "click",
        function (event) {

            if (event.target === elements.modalOverlay) {
                closeModal();
            }
        }
    );

    elements.contentForm.addEventListener(
        "submit",
        saveContent
    );

    /*
        Délégation d'événement :
        les boutons Modifier/Supprimer sont recréés
        à chaque render, donc on écoute leur parent.
    */

    elements.tableContainer.addEventListener(
        "click",
        function (event) {

            const editButton =
                event.target.closest(".edit-action");

            const deleteButton =
                event.target.closest(".delete-action");

            if (editButton) {

                const id =
                    editButton.getAttribute("data-id");

                if (id) {
                    openModal(id);
                }

                return;
            }

            if (deleteButton) {

                const id =
                    deleteButton.getAttribute("data-id");

                if (id) {
                    deleteContent(id);
                }
            }
        }
    );

    elements.logoutButton.addEventListener(
        "click",
        async function () {

            try {
                await supabaseClient.auth.signOut();
            } catch (error) {
                console.error(error);
            }

            window.location.href =
                "../pages/connexion.html";
        }
    );

    elements.mobileMenu.addEventListener(
        "click",
        function () {

            elements.sidebar.classList.toggle("open");
        }
    );

    document.addEventListener(
        "keydown",
        function (event) {

            if (event.key === "Escape") {
                closeModal();
            }
        }
    );

    /* Ferme le menu mobile après navigation */

    elements.sidebar
        .querySelectorAll("a")
        .forEach(function (link) {

            link.addEventListener(
                "click",
                function () {

                    elements.sidebar.classList.remove(
                        "open"
                    );
                }
            );
        });

    /* =========================
       DÉMARRAGE
    ========================= */

    const authenticated =
        await checkAuth();

    if (authenticated) {
        await loadData();
    }

</script>

</body>
</html>
