<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Connexion staff — HoriblitiMatch</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body>


<header class="header">

    <a href="../index.html" class="logo">

        <span class="logo-icon">
            H
        </span>

        <span class="logo-text">
            Horibliti<span>Match</span>
        </span>

    </a>


    <button class="menu-toggle">

        <span></span>
        <span></span>
        <span></span>

    </button>


    <nav class="nav">

        <a href="../index.html">
            Accueil
        </a>

        <a href="studio.html">
            Le studio
        </a>

        <a href="realisations.html">
            Réalisations
        </a>

        <a href="partenaires.html">
            Partenaires
        </a>

        <a href="annonces.html">
            Annonces
        </a>

    </nav>

</header>


<main class="auth-page">


<section class="auth-card">

    <div class="auth-header">

        <span class="eyebrow">
            ESPACE PRIVÉ
        </span>

        <h1>
            Connexion staff
        </h1>

        <p>
            Connectez-vous pour accéder
            à l'administration d'HoriblitiMatch.
        </p>

    </div>


    <form id="loginForm" class="auth-form">


        <div class="form-group">

            <label for="email">
                Adresse email
            </label>

            <input
                type="email"
                id="email"
                placeholder="vous@exemple.com"
                autocomplete="email"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Mot de passe
            </label>

            <input
                type="password"
                id="password"
                placeholder="Votre mot de passe"
                autocomplete="current-password"
                required
            >

        </div>


        <div
            id="loginMessage"
            class="form-message"
        ></div>


        <button
            type="submit"
            class="button button-primary auth-submit"
        >
            Se connecter
        </button>


    </form>

</section>


</main>


<footer class="footer">

    <div class="footer-logo">
        Horibliti<span>Match</span>
    </div>

    <p>
         <span data-year></span> HoriblitiMatch.
    </p>

</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>

<script src="../js/script.js"></script>


<script>

document.addEventListener("DOMContentLoaded", async () => {

    const form =
        document.getElementById("loginForm");

    const message =
        document.getElementById("loginMessage");


    /*
     * Si déjà connecté,
     * on vérifie s'il est staff.
     */

    const {
        data: {
            session
        }
    } = await supabaseClient.auth.getSession();


    if (session) {

        const {
            data: staff
        } = await supabaseClient
            .from("staff")
            .select("id")
            .eq("id", session.user.id)
            .maybeSingle();


        if (staff) {

            window.location.href =
                "../staff/index.html";

            return;

        }

    }


    form.addEventListener(
        "submit",
        async event => {

            event.preventDefault();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            const button =
                form.querySelector("button");


            message.textContent = "";

            message.className =
                "form-message";


            button.disabled = true;

            button.textContent =
                "Connexion...";


            const {
                data,
                error
            } = await supabaseClient.auth
                .signInWithPassword({
                    email,
                    password
                });


            if (error) {

    console.error("ERREUR SUPABASE :", error);

    message.textContent =
        error.message;

    message.classList.add("error");

    button.disabled = false;

    button.textContent =
        "Se connecter";

    return;
}

            


            /*
             * Vérification STAFF
             */

            const {
                data: staff,
                error: staffError
            } = await supabaseClient
                .from("staff")
                .select("id, role")
                .eq("id", data.user.id)
                .maybeSingle();


            if (
                staffError ||
                !staff
            ) {

                await supabaseClient.auth.signOut();

                message.textContent =
                    "Ce compte n'est pas autorisé à accéder au panel.";

                message.classList.add("error");

                button.disabled = false;

                button.textContent =
                    "Se connecter";

                return;

            }


            message.textContent =
                "Connexion réussie.";

            message.classList.add("success");


            window.location.href =
                "../staff/index.html";

        }
    );

});

</script>


</body>
</html>
