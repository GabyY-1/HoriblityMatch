<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion staff — HoriblitiMatch</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header class="header">
    <a href="../index.html" class="logo">
        Horibliti<span>Match</span>
    </a>

    <button class="menu-toggle" aria-label="Ouvrir le menu">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <nav class="nav">
        <a href="../index.html">Accueil</a>
        <a href="studio.html">Le studio</a>
        <a href="realisations.html">Réalisations</a>
        <a href="partenaires.html">Partenaires</a>
        <a href="annonces.html">Annonces</a>
    </nav>
</header>


<main class="auth-page">

    <section class="auth-card">

        <div class="auth-header">
            <span class="eyebrow">ESPACE PRIVÉ</span>

            <h1>Connexion staff</h1>

            <p>
                Connectez-vous pour accéder à l'espace de gestion
                d'HoriblitiMatch.
            </p>
        </div>


        <form id="loginForm" class="auth-form">

            <div class="form-group">
                <label for="email">Adresse email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="vous@exemple.com"
                    autocomplete="email"
                    required
                >
            </div>


            <div class="form-group">
                <label for="password">Mot de passe</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Votre mot de passe"
                    autocomplete="current-password"
                    required
                >
            </div>


            <p id="loginMessage" class="form-message"></p>


            <button type="submit" class="btn primary auth-submit">
                Se connecter
            </button>

        </form>

    </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/script.js"></script>


<script>
document.addEventListener("DOMContentLoaded", () => {

    const form = document.getElementById("loginForm");
    const message = document.getElementById("loginMessage");

    form.addEventListener("submit", async (event) => {

        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        message.textContent = "";
        message.className = "form-message";

        const button = form.querySelector("button");

        button.disabled = true;
        button.textContent = "Connexion...";

        try {

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                throw error;
            }

            if (!data.session) {
                throw new Error("Impossible de créer la session.");
            }

            message.textContent = "Connexion réussie !";
            message.classList.add("success");

            setTimeout(() => {
                window.location.href = "../staff/index.html";
            }, 500);

        } catch (error) {

            console.error(error);

            message.textContent =
                "Email ou mot de passe incorrect.";

            message.classList.add("error");

            button.disabled = false;
            button.textContent = "Se connecter";
        }
    });

});
</script>

</body>
</html>
